name: ijachi-llm-router CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    name: Run Pytest & Verify 20 Providers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Pytest Suite
        run: pytest

      - name: Verify Provider Registry
        run: ijachi-router providers

  route-demo:
    name: GitHub Action Integration Test
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Route Prompt with ijachi-llm-router
        id: llm
        uses: ./
        with:
          prompt: "Write a high-level summary of the code changes in this commit"
          priority: "cost"
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      - name: Display Routing Results
        run: |
          echo "Generated Output:"
          echo "${{ steps.llm.outputs.response }}"
          echo "Model Used: ${{ steps.llm.outputs.model }}"
          echo "Provider: ${{ steps.llm.outputs.provider }}"
