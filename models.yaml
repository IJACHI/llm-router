# ijachi-llm-router model catalog
# ────────────────────────────────────────────────────────────────────────────
# Preconfigured matrix of 20 major LLM service providers & models (as of August 2026).
# Edit this file to customize models, pricing, or tags. No code changes needed.
#
# Fields:
#   provider       : matching REGISTRY key (anthropic | openai | deepseek | gemini | groq | mistral | moonshot | qwen | perplexity | cohere | together | openrouter | cerebras | sambanova | fireworks | huggingface | custom | azure | bedrock | local)
#   model_id       : exact string passed to the provider API
#   tags           : list of task categories this model excels at
#   input_per_1k   : cost in USD per 1 000 input tokens
#   output_per_1k  : cost in USD per 1 000 output tokens
#   max_context    : context window in tokens
#   speed_tier     : fast | medium | slow
#
# Valid tags:
#   code | math | creative | summarization | reasoning | long-context | simple-qa

models:
  # ── Cerebras Cloud (Ultra-Fast Hardware >1,800 tok/s) ────────────────────────
  - provider: cerebras
    model_id: llama3.1-70b
    tags: [code, reasoning, summarization, simple-qa]
    input_per_1k: 0.0006
    output_per_1k: 0.0006
    max_context: 128000
    speed_tier: fast

